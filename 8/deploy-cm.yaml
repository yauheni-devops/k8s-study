apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeting
  template:
    metadata:
      labels:
        app: greeting
    spec:
      containers:
      - name: busybox
        image: busybox
        imagePullPolicy: IfNotPresent  # Используем локальный образ (помня о проблемах с сетью)
        # Каждые 5 секунд выводим содержимое переменной окружения MY_GREETING
        command: ["/bin/sh", "-c", "while true; do echo $MY_GREETING; sleep 5; done"]
        env:
          - name: MY_GREETING             # Имя переменной ВНУТРИ контейнера
            valueFrom:
              configMapKeyRef:
                name: app-config          # Имя ConfigMap, который мы создали выше
                key: GREETING_TEXT        # Ключ внутри ConfigMap