apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow
  template:
    metadata:
      labels:
        app: slow
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        imagePullPolicy: IfNotPresent  # <--- Теперь эта строка точно будет
        
        # Эмуляция: 30 сек спим, потом создаем файл
        command: ["/bin/sh", "-c", "echo 'Loading...' && sleep 30 && touch /tmp/loaded && nginx -g 'daemon off;'"]
        
        startupProbe:
          exec:
            command: ["cat", "/tmp/loaded"]
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          failureThreshold: 1